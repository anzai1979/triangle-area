<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="三角形面積">
  <title>三角形 面積計算</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f7f8fa;
      color: #18202a;
      padding:
        max(18px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin: 4px 0 18px;
      text-align: center;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e3e7eb;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      font-size: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #cbd2d9;
      background: #ffffff;
      color: #18202a;
      min-height: 48px;
    }

    .angle-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .unit {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 5px;
      text-align: center;
    }

    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 11px;
      padding: 12px 18px;
      font-size: 17px;
      font-weight: 800;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
    }

    .result-card {
      background: #eaf2ff;
      border-radius: 18px;
      padding: 22px;
      text-align: center;
      margin-bottom: 16px;
    }

    .result-label {
      font-size: 14px;
      font-weight: 700;
      opacity: 0.72;
    }

    #result {
      font-size: clamp(34px, 9vw, 56px);
      font-weight: 900;
      line-height: 1.15;
      word-break: break-word;
      margin: 5px 0;
    }

    .formula {
      font-size: 15px;
      line-height: 1.7;
    }

    .error {
      min-height: 20px;
      color: #d92d20;
      font-weight: 700;
      margin-top: 8px;
    }

    .decimal-angle {
      margin-top: 8px;
      font-size: 14px;
      opacity: 0.72;
    }

    @media (max-width: 420px) {
      .angle-grid {
        gap: 8px;
      }

      input {
        padding: 11px 10px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <h1>三角形 面積計算</h1>

    <section class="card">

      <div class="field">
        <label for="sideA">辺 a の長さ</label>
        <input
          id="sideA"
          type="number"
          min="0"
          step="any"
          inputmode="decimal"
          value="10">
      </div>

      <div class="field">
        <label for="sideB">辺 b の長さ</label>
        <input
          id="sideB"
          type="number"
          min="0"
          step="any"
          inputmode="decimal"
          value="8">
      </div>

      <div class="field">

        <label>夾角</label>

        <div class="angle-grid">

          <div>
            <input
              id="deg"
              type="number"
              min="0"
              max="179"
              step="1"
              inputmode="numeric"
              value="60"
              aria-label="度">

            <div class="unit">
              度（°）
            </div>
          </div>

          <div>
            <input
              id="min"
              type="number"
              min="0"
              max="59"
              step="1"
              inputmode="numeric"
              value="0"
              aria-label="分">

            <div class="unit">
              分（′）
            </div>
          </div>

          <div>
            <input
              id="sec"
              type="number"
              min="0"
              max="59.999999"
              step="any"
              inputmode="decimal"
              value="0"
              aria-label="秒">

            <div class="unit">
              秒（″）
            </div>
          </div>

        </div>

        <div id="decimalAngle" class="decimal-angle"></div>

      </div>

      <button id="calcBtn" type="button">
        面積を計算
      </button>

      <div
        id="error"
        class="error"
        aria-live="polite">
      </div>

    </section>

    <section class="result-card">

      <div class="result-label">
        三角形の面積
      </div>

      <div
        id="result"
        aria-live="polite">
        34.641
      </div>

      <div>
        平方単位
      </div>

    </section>

    <section class="card formula">

      <strong>
        計算式
      </strong>

      <br>

      面積 ＝ 1/2 × a × b × sin θ

      <div
        id="formulaDetail"
        style="margin-top:6px;opacity:.75;">
      </div>

    </section>

  </main>

  <script>

    const sideA =
      document.getElementById("sideA");

    const sideB =
      document.getElementById("sideB");

    const deg =
      document.getElementById("deg");

    const min =
      document.getElementById("min");

    const sec =
      document.getElementById("sec");

    const result =
      document.getElementById("result");

    const error =
      document.getElementById("error");

    const formulaDetail =
      document.getElementById("formulaDetail");

    const decimalAngle =
      document.getElementById("decimalAngle");


    function fmt(n) {

      if (!Number.isFinite(n)) {
        return "－";
      }

      return Number(
        n.toFixed(6)
      ).toLocaleString(
        "ja-JP",
        {
          maximumFractionDigits: 6
        }
      );

    }


    function calculate() {

      const a =
        Number(sideA.value);

      const b =
        Number(sideB.value);

      const d =
        Number(deg.value);

      const m =
        Number(min.value);

      const s =
        Number(sec.value);


      if (
        ![a, b, d, m, s]
        .every(Number.isFinite)
      ) {

        error.textContent =
          "すべての数値を入力してください。";

        result.textContent =
          "－";

        decimalAngle.textContent =
          "";

        return;
      }


      if (
        a <= 0 ||
        b <= 0
      ) {

        error.textContent =
          "辺の長さは0より大きい数値にしてください。";

        result.textContent =
          "－";

        return;
      }


      if (
        d < 0 ||
        d >= 180 ||
        m < 0 ||
        m >= 60 ||
        s < 0 ||
        s >= 60
      ) {

        error.textContent =
          "角度は「0〜179度、0〜59分、0〜59.999秒」で入力してください。";

        result.textContent =
          "－";

        return;
      }


      const angle =
        d +
        m / 60 +
        s / 3600;


      if (
        angle <= 0 ||
        angle >= 180
      ) {

        error.textContent =
          "夾角は0°より大きく180°より小さくしてください。";

        result.textContent =
          "－";

        return;
      }


      const radians =
        angle *
        Math.PI /
        180;


      const area =
        0.5 *
        a *
        b *
        Math.sin(radians);


      error.textContent =
        "";


      result.textContent =
        fmt(area);


      decimalAngle.textContent =
        "10進角：" +
        fmt(angle) +
        "°";


      formulaDetail.textContent =

        "1/2 × " +
        fmt(a) +
        " × " +
        fmt(b) +
        " × sin(" +
        d +
        "°" +
        m +
        "′" +
        fmt(s) +
        "″) ＝ " +
        fmt(area);

    }


    document
      .getElementById("calcBtn")
      .addEventListener(
        "click",
        calculate
      );


    [
      sideA,
      sideB,
      deg,
      min,
      sec
    ].forEach(
      function(el) {

        el.addEventListener(
          "input",
          calculate
        );

      }
    );


    calculate();


    if (
      "serviceWorker"
      in navigator
    ) {

      window.addEventListener(
        "load",
        function() {

          navigator
            .serviceWorker
            .register(
              "./service-worker.js"
            )
            .catch(
              function() {}
            );

        }
      );

    }

  </script>

</body>
</html>
